name: backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'api/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'api/**', '.github/workflows/backend.yml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check koverVerify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            backend/**/build/reports/
            backend/**/build/test-results/

  image:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build fat JAR
        working-directory: backend
        run: ./gradlew :app:buildFatJar
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/matthias1309/family-planner:${{ github.sha }}
            ghcr.io/matthias1309/family-planner:stable
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
