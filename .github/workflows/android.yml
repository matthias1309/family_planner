name: android

on:
  push:
    branches: [main]
    paths: ['android/**', 'api/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'api/**', '.github/workflows/android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Normal runs take 2-4 minutes; a hung Kotlin daemon must fail fast instead of blocking for 6 hours.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Der Runner bringt das Android SDK mit; fehlende Plattformen lädt AGP nach, sobald die Lizenzen akzeptiert sind.
      - name: Accept Android SDK licenses
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      # koverVerifyDebug instead of koverVerify: the total report would also compile every release variant.
      - run: ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest koverVerifyDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
