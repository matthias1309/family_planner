    Dish:
      type: object
      required: [id, date, cookId, name, ingredients, status, late, dayValid]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        cookId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        ingredients:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 80 }
        status: { $ref: '#/components/schemas/DishStatus' }
        rejectionReason: { type: string, maxLength: 200, nullable: true }
        late: { type: boolean, description: Vom Kind nach seiner Frist gespeichert }
        dayValid: { type: boolean, description: 'false, wenn das kochende Kind an dem Tag nicht (mehr) anwesend ist' }

    SaveDishRequest:
      type: object
      required: [date, cookId, name, ingredients]
      properties:
        date: { type: string, format: date }
        cookId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        ingredients:
          type: array
          description: Eine Zeile pro Zutat; Leerzeilen werden entfernt, danach höchstens 30 Zeilen.
          maxItems: 100
          items: { type: string, maxLength: 80 }

    PlanDay:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        dish:
          allOf:
