openapi: 3.0.3
info:
  title: Family Planner API
  version: 0.8.0
  description: Vertrag zwischen Android-App und Backend (ADR-0004). Alle Antworten nutzen den Envelope {success, data, error}.
servers:
  - url: https://planner.home.arpa:8095
security:
  - deviceToken: []
tags:
  - name: system
  - name: auth
  - name: members
  - name: devices
  - name: meals
  - name: tasks
  - name: gamification

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Gesundheitsstatus inkl. Datenbank
      security: []
      responses:
        '200':
          description: Backend und Datenbank erreichbar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: Datenbank nicht erreichbar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /api/v1/setup:
    post:
      operationId: setupFamily
      tags: [auth]
      summary: Erst-Einrichtung (erstes Elternteil + Gerät), nur solange keine Mitglieder existieren
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
      responses:
        '201':
          description: Elternteil und Gerät angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingResultResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SetupDisabled' }

  /api/v1/devices/pair:
    post:
      operationId: pairDevice
      tags: [auth]
      summary: Gerät mit Kopplungscode einem Mitglied zuordnen
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairDeviceRequest' }
      responses:
        '201':
          description: Gerät gekoppelt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingResultResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Angemeldetes Mitglied und Gerät
      responses:
        '200':
          description: Aktuelles Mitglied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: Alle Familienmitglieder
      responses:
        '200':
          description: Mitgliederliste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createMember
      tags: [members]
      summary: Mitglied anlegen (nur Eltern)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMemberRequest' }
      responses:
        '201':
          description: Mitglied angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/members/{memberId}/pairing-codes:
    post:
      operationId: createPairingCode
      tags: [members]
      summary: Kopplungscode für ein Mitglied erzeugen (nur Eltern)
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '201':
          description: Code erzeugt (alter Code ist ungültig)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingCodeResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: Alle aktiven Geräte (nur Eltern)
      responses:
        '200':
          description: Geräteliste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Gerät entfernen (nur Eltern)
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Gerät entfernt
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/profiles:
    get:
      operationId: listAttendanceProfiles
      tags: [meals]
      summary: Anwesenheitsprofile aller Kinder (Default-Profil, wenn keins gespeichert ist)
      responses:
        '200':
          description: Profile in der Reihenfolge der Mitglieder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceProfileListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/profiles/{memberId}:
    put:
      operationId: updateAttendanceProfile
      tags: [meals]
      summary: Profil eines Kindes setzen (kocht, Anwesenheitsmuster) (nur Eltern)
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAttendanceProfileRequest' }
      responses:
        '200':
          description: Profil gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceProfileResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/profiles/{memberId}/exceptions:
    get:
      operationId: listAttendanceExceptions
      tags: [meals]
      summary: Anwesenheits-Ausnahmen eines Kindes, nach Beginn sortiert
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Ausnahmen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceExceptionListResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createAttendanceException
      tags: [meals]
      summary: Ausnahme anlegen, z. B. Ferien (nur Eltern)
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAttendanceExceptionRequest' }
      responses:
        '201':
          description: Ausnahme angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceExceptionResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/exceptions/{exceptionId}:
    delete:
      operationId: deleteAttendanceException
      tags: [meals]
      summary: Ausnahme löschen (nur Eltern)
      parameters:
        - $ref: '#/components/parameters/ExceptionId'
      responses:
        '204':
          description: Ausnahme gelöscht
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/settings:
    get:
      operationId: getDeadlineSettings
      tags: [meals]
      summary: Fristeinstellungen (aktuell und vorgemerkt)
      responses:
        '200':
          description: Einstellungen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadlineSettingsOverviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      operationId: updateDeadlineSettings
      tags: [meals]
      summary: Fristeinstellungen ändern, gilt ab der übernächsten Planwoche (nur Eltern)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDeadlineSettingsRequest' }
      responses:
        '200':
          description: Einstellungen vorgemerkt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadlineSettingsOverviewResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/weeks/{weekStart}/attendance:
    get:
      operationId: getWeekAttendance
      tags: [meals]
      summary: Anwesenheit aller Kinder und Fristen für eine Planwoche
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      responses:
        '200':
          description: Wochenübersicht
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeekAttendanceResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/weeks/{weekStart}/plan:
    get:
      operationId: getWeekPlan
      tags: [meals]
      summary: Wochenplan Mo–So mit Gericht je Tag
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      responses:
        '200':
          description: Wochenplan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeekPlanResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/weeks/{weekStart}/status:
    get:
      operationId: getWeekStatus
      tags: [meals]
      summary: "Wochenstatus: offene Tage, Einreichungen, Freigaben"
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      responses:
        '200':
          description: Wochenstatus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeekStatusResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/weeks/{weekStart}/cancellations/{memberId}:
    put:
      operationId: cancelCooking
      tags: [meals]
      summary: Kochen einer Woche absagen (Kind für sich, Eltern für jedes Kind)
      parameters:
        - $ref: '#/components/parameters/WeekStart'
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelCookingRequest' }
      responses:
        '200':
          description: Absage gespeichert, Gericht der Woche entfernt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CookingCancellationResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: withdrawCookingCancellation
      tags: [meals]
      summary: Absage zurücknehmen
      parameters:
        - $ref: '#/components/parameters/WeekStart'
        - $ref: '#/components/parameters/MemberId'
      responses:
        '204':
          description: Absage zurückgenommen
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/weeks/{weekStart}/shopping-list:
    get:
      operationId: getShoppingList
      tags: [meals]
      summary: Einkaufsliste der Planwoche (freigegebene Gerichte zusammengeführt, freie Einträge, Häkchen)
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      responses:
        '200':
          description: Einkaufsliste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/weeks/{weekStart}/shopping-list/items:
    post:
      operationId: addShoppingItem
      tags: [meals]
      summary: Freien Eintrag hinzufügen (nur Eltern)
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Ingredient' }
      responses:
        '201':
          description: Eintrag hinzugefügt, aktuelle Liste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/weeks/{weekStart}/shopping-list/items/{itemId}:
    delete:
      operationId: deleteShoppingItem
      tags: [meals]
      summary: Freien Eintrag löschen (nur Eltern)
      parameters:
        - $ref: '#/components/parameters/WeekStart'
        - $ref: '#/components/parameters/ShoppingItemId'
      responses:
        '204':
          description: Eintrag gelöscht
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/weeks/{weekStart}/shopping-list/checks:
    put:
      operationId: setShoppingEntryChecked
      tags: [meals]
      summary: Eintrag ab- oder anhaken (nur Eltern)
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckShoppingEntryRequest' }
      responses:
        '200':
          description: Häkchen gespeichert, aktuelle Liste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/recipes:
    get:
      operationId: listRecipes
      tags: [meals]
      summary: Rezepte auflisten und suchen
      description: Ohne query alle Rezepte, sonst Name enthält query (ohne Groß-/Kleinschreibung); sortiert nach Name.
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 60 }
      responses:
        '200':
          description: Rezepte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeListResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createRecipe
      tags: [meals]
      summary: Rezept anlegen (nur Eltern)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveRecipeRequest' }
      responses:
        '201':
          description: Rezept angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/recipes/{recipeId}:
    get:
      operationId: getRecipe
      tags: [meals]
      summary: Rezept mit Zutaten und Schritten
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      responses:
        '200':
          description: Rezept
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      operationId: updateRecipe
      tags: [meals]
      summary: Rezept ändern (nur Eltern); übernommene Gerichte bleiben unverändert
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveRecipeRequest' }
      responses:
        '200':
          description: Rezept geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteRecipe
      tags: [meals]
      summary: Rezept löschen (nur Eltern); übernommene Gerichte bleiben
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      responses:
        '204':
          description: Rezept gelöscht
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/dishes:
    post:
      operationId: createDish
      tags: [meals]
      summary: Gericht planen (Eltern) oder einreichen (kochendes Kind, nur für sich)
      description: Eltern speichern direkt freigegeben. Ein Kind darf nur mit cookId gleich der eigenen ID einreichen (Status SUBMITTED); für andere 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDishRequest' }
      responses:
        '201':
          description: Gericht geplant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DishResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/dishes/{dishId}:
    put:
      operationId: updateDish
      tags: [meals]
      summary: Gericht ändern oder verschieben (Eltern; Kind nur eigenes)
      parameters:
        - $ref: '#/components/parameters/DishId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDishRequest' }
      responses:
        '200':
          description: Gericht geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DishResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteDish
      tags: [meals]
      summary: Gericht löschen, Tag wird wieder offen (nur Eltern)
      parameters:
        - $ref: '#/components/parameters/DishId'
      responses:
        '204':
          description: Gericht gelöscht
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/dishes/{dishId}/approval:
    post:
      operationId: approveDish
      tags: [meals]
      summary: Kindergericht freigeben (nur Eltern)
      parameters:
        - $ref: '#/components/parameters/DishId'
      responses:
        '204':
          description: Gericht freigegeben
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/meals/dishes/{dishId}/rejection:
    post:
      operationId: rejectDish
      tags: [meals]
      summary: Kindergericht mit Begründung ablehnen (nur Eltern)
      parameters:
