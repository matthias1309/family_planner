              schema: { $ref: '#/components/schemas/GameSettingsResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer

  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DishId:
      name: dishId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShoppingItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WeekStart:
      name: weekStart
      in: path
      required: true
      description: Montag der Planwoche (yyyy-MM-dd)
      schema: { type: string, format: date }
    CatalogTaskId:
      name: catalogTaskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncludeArchived:
      name: includeArchived
      in: query
      required: false
      schema: { type: boolean, default: false }
    HistoryLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    ValidationFailed:
      description: Ungültige Anfrage
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Nicht angemeldet bzw. Token/Code ungültig
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Nur für Eltern
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Nicht gefunden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Konflikt mit bestehendem Zustand
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Zu viele Anfragen
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SetupDisabled:
      description: Einrichtung nicht verfügbar (kein Setup-Token konfiguriert)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Role:
      type: string
      enum: [PARENT, CHILD]

    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - INVALID_PAIRING_CODE
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - SETUP_DISABLED
        - INTERNAL

    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }

    HealthStatus:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, error] }
        version: { type: string }

    Member:
      type: object
      required: [id, name, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }

    Device:
      type: object
      required: [id, memberId, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time, nullable: true }

    PairingCode:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        expiresAt: { type: string, format: date-time }

    PairingResult:
      type: object
      required: [token, member, device]
      properties:
        token: { type: string }
        member: { $ref: '#/components/schemas/Member' }
        device: { $ref: '#/components/schemas/Device' }

    Me:
      type: object
      required: [member, deviceId]
      properties:
        member: { $ref: '#/components/schemas/Member' }
        deviceId: { type: string, format: uuid }

    SetupRequest:
      type: object
      required: [setupToken, parentName, deviceName]
      properties:
        setupToken: { type: string, minLength: 16 }
        parentName: { type: string, minLength: 1, maxLength: 40 }
        deviceName: { type: string, minLength: 1, maxLength: 60 }

    PairDeviceRequest:
      type: object
      required: [code, deviceName]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        deviceName: { type: string, minLength: 1, maxLength: 60 }

    CreateMemberRequest:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        role: { $ref: '#/components/schemas/Role' }

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean }
        error: { $ref: '#/components/schemas/ApiError' }

    PairingResultResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data:
          allOf:
            - $ref: '#/components/schemas/PairingResult'
          nullable: true
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
          nullable: true

    MeResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data:
          allOf:
            - $ref: '#/components/schemas/Me'
          nullable: true
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
          nullable: true

    MemberResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data:
          allOf:
            - $ref: '#/components/schemas/Member'
          nullable: true
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
          nullable: true

    MemberListResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Member' }
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
          nullable: true

    DeviceListResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Device' }
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
          nullable: true

    PairingCodeResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data:
          allOf:
            - $ref: '#/components/schemas/PairingCode'
          nullable: true
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
          nullable: true

    Weekday:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

    PatternType:
      type: string
      enum: [ALWAYS, ALTERNATING]

    Presence:
      type: string
      enum: [PRESENT, ABSENT]

    AttendanceSource:
      type: string
      enum: [PATTERN, EXCEPTION]

    AttendancePattern:
      type: object
      description: >
        ALWAYS - an allen Tagen anwesend (weekA/weekB leer, referenceWeek null).
        ALTERNATING - Woche A/B mit je einer Tagesmenge; referenceWeek ist der Montag einer A-Woche.
      required: [type, weekA, weekB]
      properties:
        type: { $ref: '#/components/schemas/PatternType' }
        weekA:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Weekday' }
        weekB:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Weekday' }
        referenceWeek:
          type: string
          format: date
          nullable: true

    AttendanceProfile:
      type: object
      required: [memberId, cooks, pattern]
      properties:
        memberId: { type: string, format: uuid }
        cooks: { type: boolean }
        pattern: { $ref: '#/components/schemas/AttendancePattern' }

    UpdateAttendanceProfileRequest:
      type: object
      required: [cooks, pattern]
      properties:
        cooks: { type: boolean }
        pattern: { $ref: '#/components/schemas/AttendancePattern' }

    AttendanceException:
      type: object
      required: [id, memberId, from, to, presence, createdAt]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        presence: { $ref: '#/components/schemas/Presence' }
        note: { type: string, maxLength: 60, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateAttendanceExceptionRequest:
      type: object
      required: [from, to, presence]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        presence: { $ref: '#/components/schemas/Presence' }
