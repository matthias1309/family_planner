    Weekday:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

    PatternType:
      type: string
      enum: [ALWAYS, ALTERNATING]

    Presence:
      type: string
      enum: [PRESENT, ABSENT]

    AttendanceSource:
      type: string
      enum: [PATTERN, EXCEPTION]

    AttendancePattern:
      type: object
      description: >
        ALWAYS - an allen Tagen anwesend (weekA/weekB leer, referenceWeek null).
        ALTERNATING - Woche A/B mit je einer Tagesmenge; referenceWeek ist der Montag einer A-Woche.
      required: [type, weekA, weekB]
      properties:
        type: { $ref: '#/components/schemas/PatternType' }
        weekA:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Weekday' }
        weekB:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Weekday' }
        referenceWeek:
          type: string
          format: date
          nullable: true

    AttendanceProfile:
      type: object
      required: [memberId, cooks, pattern]
      properties:
        memberId: { type: string, format: uuid }
        cooks: { type: boolean }
        pattern: { $ref: '#/components/schemas/AttendancePattern' }

    UpdateAttendanceProfileRequest:
      type: object
      required: [cooks, pattern]
      properties:
        cooks: { type: boolean }
        pattern: { $ref: '#/components/schemas/AttendancePattern' }

    AttendanceException:
      type: object
      required: [id, memberId, from, to, presence, createdAt]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        presence: { $ref: '#/components/schemas/Presence' }
        note: { type: string, maxLength: 60, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateAttendanceExceptionRequest:
      type: object
      required: [from, to, presence]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        presence: { $ref: '#/components/schemas/Presence' }
        note: { type: string, maxLength: 60, nullable: true }

    DeadlineSettings:
      type: object
      required: [orderDeadlineDay, orderDeadlineTime, childDeadlineTime, effectiveFrom]
      properties:
        orderDeadlineDay: { $ref: '#/components/schemas/Weekday' }
        orderDeadlineTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        childDeadlineTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        effectiveFrom: { type: string, format: date }

    UpdateDeadlineSettingsRequest:
      type: object
      required: [orderDeadlineDay, orderDeadlineTime, childDeadlineTime]
      properties:
